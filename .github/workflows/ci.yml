name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      video:
        description: Video URL for the live check
        required: false
        default: https://www.youtube.com/watch?v=1UL8iZJD38U

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  live:
    # GitHub-hosted runners sit on datacenter IPs, the same kind YouTube blocks
    # on Vercel and Lambda, so this shows both paths for real.
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/live-check.mjs "$VIDEO"
        env:
          VIDEO: ${{ inputs.video }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

  published:
    # Installs the released package from npm, the way a user would, and fetches
    # a transcript from this blocked runner.
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir smoke && cd smoke && npm init -y >/dev/null
          npm install youtube-transcript-dropin
          node --input-type=module -e "
            import { YoutubeTranscript } from 'youtube-transcript-dropin';
            const rows = await YoutubeTranscript.fetchTranscript(process.env.VIDEO);
            console.log(rows.length + ' lines, first: ' + JSON.stringify(rows[0]));
            if (!rows.length) process.exit(1);
          "
          node -e "const { YoutubeTranscript } = require('youtube-transcript-dropin'); console.log(typeof YoutubeTranscript.fetchTranscript)"
        env:
          VIDEO: ${{ inputs.video }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
