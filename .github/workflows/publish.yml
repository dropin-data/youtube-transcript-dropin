name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # Trusted publishing (OIDC) is set up on npmjs.com, so no token is stored.
      # The publisher may only stage: each release waits on npmjs.com (Staged
      # Packages) until a maintainer approves it. Needs a current npm; Node 22
      # ships with npm 10.
      - run: npm install -g npm@latest
      - run: npm stage publish --provenance --access public
